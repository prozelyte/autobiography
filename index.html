    /* =====================================================================
       1. DESIGN TOKENS & BASE PALETTES
       ===================================================================== */
    :root {
      /* Default Sovereign Nocturne (Deep Obsidian & Royal Gold) */
      --bg-primary: #0a0910;
      --bg-secondary: #13111c;
      --bg-surface: #1a1726;
      --bg-surface-elevated: #242036;
      --border-accent: #c5a059;
      --border-subtle: rgba(197, 160, 89, 0.25);
      --text-main: #ece8e1;
      --text-muted: #9e9aa7;
      --accent-glow: rgba(197, 160, 89, 0.15);
      --font-display: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'Fira Code', monospace;
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      --radius-sm: 4px;
      --radius-md: 8px;
      --filigree-display: block;
      --texture-overlay: radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.05) 0%, transparent 75%);
    }

    /* THEME 1: Flesh & Web (Magnus Archives / Outlast Trials Decay) */
    body[data-theme="archive-horror"] {
      --bg-primary: #11100e;
      --bg-secondary: #181613;
      --bg-surface: #221f1a;
      --bg-surface-elevated: #2d2922;
      --border-accent: #8b3a2b; /* Dull surgical rust / oxidized blood */
      --border-subtle: rgba(94, 102, 65, 0.35); /* Chitinous olive tint */
      --text-main: #d3cbbe; /* Rotted bone / parchment */
      --text-muted: #797163;
      --accent-glow: rgba(139, 58, 43, 0.25);
      --font-display: 'Cormorant Garamond', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --filigree-display: none;
      --texture-overlay: radial-gradient(circle at 20% 30%, rgba(94, 102, 65, 0.1) 0%, transparent 60%),
                         radial-gradient(circle at 80% 80%, rgba(139, 58, 43, 0.12) 0%, transparent 70%);
    }

    /* THEME 2: Imperial Gilded / Sovereign */
    body[data-theme="imperial-gilded"] {
      --bg-primary: #050b08; /* Deep Velvet Emerald / Obsidian */
      --bg-secondary: #0a1410;
      --bg-surface: #101e18;
      --bg-surface-elevated: #162820;
      --border-accent: #e5c158;
      --border-subtle: rgba(229, 193, 88, 0.45);
      --text-main: #fcf9ee;
      --text-muted: #a3b2a9;
      --accent-glow: rgba(229, 193, 88, 0.22);
      --font-display: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
      --radius-sm: 0px;
      --radius-md: 2px;
      --filigree-display: block;
      --texture-overlay: radial-gradient(circle at 50% 50%, rgba(229, 193, 88, 0.08) 0%, transparent 80%);
    }

    /* THEME 3: Monochrome Terminal / Stark Minimalist */
    body[data-theme="mono-terminal"] {
      --bg-primary: #000000;
      --bg-secondary: #080808;
      --bg-surface: #111111;
      --bg-surface-elevated: #1a1a1a;
      --border-accent: #ffffff;
      --border-subtle: #333333;
      --text-main: #ffffff;
      --text-muted: #888888;
      --accent-glow: rgba(255, 255, 255, 0.1);
      --font-display: 'Fira Code', monospace;
      --font-body: 'Fira Code', monospace;
      --radius-sm: 0px;
      --radius-md: 0px;
      --filigree-display: none;
      --texture-overlay: none;
    }

    /* =====================================================================
       2. GLOBAL RESETS & FOUNDATION
       ===================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Ambient procedural canvas texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--texture-overlay);
      pointer-events: none;
      z-index: 1;
    }
