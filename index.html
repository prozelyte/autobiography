<!DOCTYPE html>
<html lang="en" data-theme="royal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOVEREIGN ARCHIVE // PERSONAL NEXUS</title>

  <!-- ==========================================================================
       FRONT-END SECURITY & PRIVACY ARCHITECTURE (STATIC GITHUB PAGES PROTECTION)
       ==========================================================================
       1. Content Security Policy (CSP):
          - Restricts where scripts, styles, images, and fonts can be loaded from.
          - Blocks unauthorized third-party script injections (XSS mitigation),
            external framing/clickjacking, and untrusted form submissions.
       2. Referrer Policy ('no-referrer'):
          - Prevents external websites from seeing your visitors' origin URL when
            clicking outbound social links.
       3. Anti-Scraper Contact Obfuscation (Implemented in JS below):
          - Personal contact handles and emails are never stored in plain text in
            the HTML DOM, preventing automated bots from harvesting your data.
       ========================================================================== -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: https:;
    connect-src 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  " />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />

  <!-- Google Fonts: Cinzel & Cormorant (Royal/Gilded), Plus Jakarta Sans (Sleek UI), JetBrains Mono & Special Elite (Archive/Terminal) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;700&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. THEME ENGINE TOKENS (DEFAULT: DARK ROYAL + 3 REFORMAT MODES)
       ========================================================================== */
    
    /* DEFAULT: Sleek Dark & Royal */
    :root,
    [data-theme="royal"] {
      --bg-base: #0a0910;
      --bg-surface: #13111c;
      --bg-elevated: #1b1828;
      --bg-glass: rgba(19, 17, 28, 0.88);
      --text-primary: #ece8e1;
      --text-secondary: #a39cb0;
      --accent-primary: #c5a059;
      --accent-secondary: #8a64d6;
      --accent-glow: rgba(197, 160, 89, 0.22);
      --border-main: 1px solid rgba(197, 160, 89, 0.38);
      --border-strong: 1px solid #c5a059;
      --shadow-card: 0 14px 34px rgba(0, 0, 0, 0.65);
      --font-display: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 6px;
      --horror-opacity: 0;
    }

    /* OPTION 1: Archive / Flesh & Web (Magnus Archives & Outlast Trials) */
    [data-theme="horror"] {
      --bg-base: #090a07;
      --bg-surface: #141610;
      --bg-elevated: #1c1f16;
      --bg-glass: rgba(18, 20, 14, 0.94);
      --text-primary: #d5ceb8;
      --text-secondary: #8c8773;
      --accent-primary: #7cfc00; /* Night-vision Murkoff phosphor green */
      --accent-secondary: #9e2a2b; /* Dried surgical rust / blood */
      --accent-glow: rgba(158, 42, 43, 0.35);
      --border-main: 1px dashed rgba(140, 135, 115, 0.45);
      --border-strong: 2px solid #9e2a2b;
      --shadow-card: 0 0 28px rgba(0, 0, 0, 0.9), inset 0 0 18px rgba(158, 42, 43, 0.15);
      --font-display: 'Special Elite', monospace;
      --font-body: 'JetBrains Mono', monospace;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 2px;
      --horror-opacity: 1;
    }

    /* OPTION 2: Imperial Gilded / Sovereign (Hyper-Luxurious Lavish Reformat) */
    [data-theme="luxury"] {
      --bg-base: #040d0a;
      --bg-surface: #081813;
      --bg-elevated: #0d241d;
      --bg-glass: rgba(8, 24, 19, 0.92);
      --text-primary: #fdfbf7;
      --text-secondary: #c9bfa8;
      --accent-primary: #f3cf7a;
      --accent-secondary: #d49b35;
      --accent-glow: rgba(243, 207, 122, 0.32);
      --border-main: 3px double rgba(243, 207, 122, 0.55);
      --border-strong: 4px double #f3cf7a;
      --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 15px rgba(243, 207, 122, 0.12);
      --font-display: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
      --font-mono: 'Cinzel', serif;
      --radius: 0px;
      --horror-opacity: 0;
    }

    /* OPTION 3: Monochrome Terminal / Minimal (Black & White Basic Reformat) */
    [data-theme="minimal"] {
      --bg-base: #000000;
      --bg-surface: #000000;
      --bg-elevated: #0a0a0a;
      --bg-glass: #000000;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --accent-primary: #ffffff;
      --accent-secondary: #ffffff;
      --accent-glow: transparent;
      --border-main: 1px solid #ffffff;
      --border-strong: 2px solid #ffffff;
      --shadow-card: none;
      --font-display: 'JetBrains Mono', monospace;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 0px;
      --horror-opacity: 0;
    }

    /* ==========================================================================
       2. GLOBAL RESET & BASE ATMOSPHERE
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.65;
      min-height: 125vh; /* Ensures page is always scrollable to trigger sidebar lock */
      overflow-x: hidden;
      transition: background-color 0.45s ease, color 0.45s ease;
      position: relative;
    }

    [data-theme="luxury"] body {
      font-size: 1.14rem;
    }

    /* Subtle ambient background pattern */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 0%, var(--accent-glow), transparent 65%);
      transition: opacity 0.5s ease;
    }

    /* Horror Scanlines & Grime Overlay */
    [data-theme="horror"] body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 998;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.18) 0px,
        rgba(0, 0, 0, 0.18) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    /* ==========================================================================
       3. HORROR SVG OVERLAYS (SPIDERWEBS, SPIDERS, & WRITHING WORMS)
       ========================================================================== */
    .horror-decor-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 990;
      opacity: var(--horror-opacity);
      transition: opacity 0.6s ease;
      overflow: hidden;
    }

    .web-corner {
      position: absolute;
      width: 280px;
      height: 280px;
      stroke: rgba(213, 206, 184, 0.26);
      fill: none;
      stroke-width: 1.2;
    }

    .web-top-right {
      top: 0;
      right: 0;
    }

    .web-bottom-left {
      bottom: 0;
      left: 0;
      transform: scale(-1, -1);
    }

    /* Dangling Spider Animation */
    .dangling-spider {
      position: absolute;
      top: -20px;
      right: 90px;
      animation: spiderDrop 7s ease-in-out infinite alternate;
    }

    @keyframes spiderDrop {
      0% { transform: translateY(0px); }
      60% { transform: translateY(145px); }
      100% { transform: translateY(95px); }
    }

    /* Writhing Worms / Parasites (The Corruption) */
    .worm-cluster {
      position: absolute;
      bottom: 18px;
      right: 28px;
      width: 190px;
      height: 90px;
      opacity: 0.55;
    }

    .worm-path {
      fill: none;
      stroke: #9e2a2b;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 28 12;
      animation: wormWrithe 4s linear infinite;
    }

    .worm-path.alt {
      stroke: #6b705c;
      stroke-width: 2.5;
      animation-direction: reverse;
      animation-duration: 3.2s;
    }

    @keyframes wormWrithe {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 80; }
    }

    /* ==========================================================================
       4. TRANSIENT HORROR NOTIFICATION BAR (MAGNUS ARCHIVES & OUTLAST TRIALS)
       ========================================================================== */
    .transient-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2000;
      background: #120d0a;
      border-bottom: 2px solid #9e2a2b;
      color: #d5ceb8;
      font-family: 'Special Elite', 'JetBrains Mono', monospace;
      padding: 12px 20px;
      transform: translateY(-120%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .transient-bar.visible {
      transform: translateY(0);
    }

    .transient-bar-text {
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      line-height: 1.4;
    }

    .transient-bar-text strong {
      color: #7cfc00;
      font-weight: 700;
    }

    .transient-bar-text .blood-tag {
      color: #ff4d4d;
    }

    .transient-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: #7cfc00;
      width: 100%;
      transform-origin: left;
    }

    .transient-bar.visible .transient-progress {
      animation: transientCountdown 8s linear forwards;
    }

    @keyframes transientCountdown {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    /* ==========================================================================
       5. ADAPTIVE NAVIGATION: TOP BAR -> PERMANENT SIDEBAR ON SCROLL
       ========================================================================== */
    .app-nav {
      position: fixed;
      z-index: 1000;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* STATE A: Initial Top Bar (Before User Scrolls) */
    body:not(.nav-docked) .app-nav {
      top: 0;
      left: 0;
      right: 0;
      height: 84px;
      border-bottom: var(--border-strong);
      padding: 0 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    /* STATE B: Permanently Docked Left Sidebar (Locked After First Scroll Down) */
    body.nav-docked .app-nav {
      top: 0;
      left: 0;
      bottom: 0;
      width: 270px;
      height: 100vh;
      border-right: var(--border-strong);
      padding: 34px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.6);
    }

    .nav-brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-brand-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--accent-primary);
      text-transform: uppercase;
    }

    .nav-dock-status {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Primary Page Links */
    .nav-links {
      display: flex;
      gap: 10px;
    }

    body.nav-docked .nav-links {
      flex-direction: column;
      margin: 28px 0 auto;
    }

    .nav-btn {
      background: transparent;
      color: var(--text-primary);
      border: var(--border-main);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      transform: translateY(-1px);
    }

    .nav-btn.active {
      background: var(--accent-primary);
      color: var(--bg-base);
      border-color: var(--accent-primary);
      font-weight: 700;
    }

    /* Lavish Button Styling when Luxury Mode is Active */
    [data-theme="luxury"] .nav-btn,
    [data-theme="luxury"] .lavish-btn {
      background: linear-gradient(135deg, #2a2111 0%, #12100b 50%, #2e2310 100%);
      border: 2px double #f3cf7a;
      color: #f3cf7a;
      box-shadow: inset 0 0 10px rgba(243, 207, 122, 0.2), 0 4px 14px rgba(0, 0, 0, 0.6);
      font-family: 'Cinzel', serif;
      letter-spacing: 0.14em;
    }

    [data-theme="luxury"] .nav-btn.active,
    [data-theme="luxury"] .lavish-btn:hover {
      background: linear-gradient(135deg, #d49b35 0%, #f9e498 50%, #b88222 100%);
      color: #040d0a;
      border-color: #ffffff;
      box-shadow: 0 0 22px rgba(243, 207, 122, 0.55);
    }

    /* Theme Switcher Controls (Docked at Bottom of Nav/Sidebar) */
    .theme-dock {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    body.nav-docked .theme-dock {
      flex-direction: column;
      align-items: stretch;
      border-top: var(--border-main);
      padding-top: 20px;
    }

    .theme-dock-label {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 4px;
      display: none;
    }

    body.nav-docked .theme-dock-label {
      display: block;
    }

    .theme-btn {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: var(--border-main);
      border-radius: var(--radius);
      padding: 8px 11px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.22s ease;
      text-align: left;
    }

    .theme-btn:hover,
    .theme-btn.active-theme {
      color: var(--accent-primary);
      border-color: var(--accent-primary);
      background: var(--bg-surface);
    }

    /* ==========================================================================
       6. MAIN CONTENT CONTAINER & SPA VIEW MANAGER
       ========================================================================== */
    .main-stage {
      position: relative;
      z-index: 10;
      max-width: 1180px;
      margin: 0 auto;
      padding: 130px 5% 90px;
      transition: padding 0.55s cubic-bezier(0.22, 1, 0.36, 1), margin 0.55s ease;
    }

    /* Shift content smoothly to make room for the permanent left sidebar */
    body.nav-docked .main-stage {
      margin-left: 270px;
      padding: 60px 6% 90px;
    }

    .page-view {
      display: none;
      opacity: 0;
    }

    .page-view.active-view {
      display: block;
      animation: fadeSlideIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       7. TYPOGRAPHY, CARDS, & REUSABLE SECTIONS
       ========================================================================== */
    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent-primary);
      margin-bottom: 10px;
      display: block;
    }

    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.1;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .royal-divider {
      height: 1px;
      background: linear-gradient(90deg, var(--accent-primary), transparent);
      margin: 28px 0;
      border: none;
    }

    [data-theme="minimal"] .royal-divider {
      background: #ffffff;
      height: 2px;
    }

    .panel-card {
      background: var(--bg-surface);
      border: var(--border-main);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow-card);
      margin-bottom: 28px;
      position: relative;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .panel-card:hover {
      border-color: var(--accent-primary);
    }

    .scroll-prompt-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      padding: 8px 14px;
      border: var(--border-main);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--accent-primary);
      background: var(--bg-elevated);
    }
